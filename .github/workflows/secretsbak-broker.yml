name: SecretsBak Broker

on:
  workflow_dispatch:
    inputs:
      action:
        required: true
        type: choice
        options: [pull, push]
      target:
        required: true
        type: string
      contentBase64:
        required: false
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  broker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target config
        id: cfg
        run: |
          python - << 'PY'
          import json, os, sys
          target = os.environ["TARGET"]
          db = json.load(open("registry.json"))
          cfg = db.get("targets", {}).get(target)
          if not cfg:
            print(f"Unknown target '{target}'. Add it to registry.json", file=sys.stderr)
            sys.exit(2)

          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a") as f:
            f.write(f"bucket={cfg['bucket']}\n")
            f.write(f"region={cfg['region']}\n")
            f.write(f"key={cfg['key'].lstrip('/')}\n")
            f.write(f"kmsKeyId={(cfg.get('kmsKeyId','') or '')}\n")
          PY
        env:
          TARGET: ${{ inputs.target }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ steps.cfg.outputs.region }}

      # ---- PULL ----
      - name: Pull from S3
        if: ${{ inputs.action == 'pull' }}
        run: |
          aws s3 cp "s3://${{ steps.cfg.outputs.bucket }}/${{ steps.cfg.outputs.key }}" ./secrets.json

      - name: Upload artifact (pull)
        if: ${{ inputs.action == 'pull' }}
        uses: actions/upload-artifact@v4
        with:
          name: secretsbak-secrets
          path: ./secrets.json
          retention-days: 1

      # ---- PUSH ----
      - name: Write secrets.json from base64 (push)
        if: ${{ inputs.action == 'push' }}
        run: |
          python - << 'PY'
          import base64, os, sys
          b64 = os.environ.get("B64","")
          if not b64:
            print("contentBase64 required for push", file=sys.stderr)
            sys.exit(2)
          open("secrets.json","wb").write(base64.b64decode(b64))
          PY
        env:
          B64: ${{ inputs.contentBase64 }}

      - name: Push to S3 (push)
        if: ${{ inputs.action == 'push' }}
        run: |
          if [ -n "${{ steps.cfg.outputs.kmsKeyId }}" ]; then
            aws s3 cp ./secrets.json "s3://${{ steps.cfg.outputs.bucket }}/${{ steps.cfg.outputs.key }}" \
              --sse aws:kms --sse-kms-key-id "${{ steps.cfg.outputs.kmsKeyId }}"
          else
            aws s3 cp ./secrets.json "s3://${{ steps.cfg.outputs.bucket }}/${{ steps.cfg.outputs.key }}" \
              --sse AES256
          fi
